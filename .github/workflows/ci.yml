name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust unit and integration tests
        run: cargo test --locked || cargo test

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build and test dependencies
        run: pip install maturin pytest pytest-asyncio
      - name: Build and install HttpR
        run: maturin develop --release
      - name: Verify both httpr and httpx imports
        run: |
          python -c "import httpr, httpx; assert httpr.Client is httpx.Client"
      - name: Run Python compatibility test suite
        run: pytest -v
